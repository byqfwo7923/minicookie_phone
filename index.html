<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Phone">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/minicookie_phone/manifest.json">
<link rel="apple-touch-icon" href="/minicookie_phone/icons/icon-192.png">
<link rel="icon" type="image/png" href="/minicookie_phone/icons/icon-192.png">
<title>Mini Phone</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--text-secondary:#8e8e93;--text-tertiary:#c7c7cc;--border:rgba(60,60,67,0.12);--accent:#007aff;--danger:#ff3b30;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--text-tertiary:#48484a;--border:rgba(255,255,255,0.1);}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.pwa-container{width:100%;height:100dvh;overflow:hidden;position:relative;background:var(--bg);}

.status-bar{position:fixed;top:0;left:0;right:0;height:calc(40px + var(--sat));padding-top:var(--sat);display:flex;justify-content:space-between;align-items:center;padding-left:calc(20px + var(--sal));padding-right:calc(20px + var(--sar));z-index:100;background:var(--bg);transition:opacity .3s,transform .3s;}
.status-bar.hidden{opacity:0;transform:translateY(-100%);pointer-events:none;}
.status-bar .time{font-size:16px;font-weight:600;}
.status-icons{display:flex;align-items:center;gap:5px;}
.battery-body{width:22px;height:11px;border:1.5px solid var(--text);border-radius:3px;padding:1px;position:relative;}
.battery-body::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:2px;height:5px;background:var(--text);border-radius:0 1px 1px 0;}
.battery-level{height:100%;width:72%;background:var(--text);border-radius:1px;}

.screen-container{width:100%;height:100%;position:relative;overflow:hidden;}
.pages-wrapper{display:flex;width:200%;height:100%;transition:transform .4s cubic-bezier(.25,.46,.45,.94);}
.page{width:50%;height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;padding-top:calc(48px + var(--sat));padding-bottom:calc(16px + var(--sab));padding-left:calc(28px + var(--sal));padding-right:calc(28px + var(--sar));}
.page::-webkit-scrollbar{display:none;}
.page-dots{position:fixed;bottom:calc(14px + var(--sab));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:50;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);transition:all .3s;}
.dot.active{background:var(--text);width:18px;border-radius:3px;}

.greeting-card{padding:8px 0 12px;}
.greeting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.avatar-ring{width:60px;height:60px;border-radius:50%;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);padding:2px;}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--bg);padding:2px;}
.avatar-img{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;}
.avatar-img svg{width:28px;height:28px;stroke:var(--text-secondary);stroke-width:1.5;fill:none;}
.greeting-text h1{font-size:25px;font-weight:700;}
.greeting-text p{font-size:15px;color:var(--text-secondary);margin-top:2px;}
.time-display{text-align:center;padding:6px 0;}
.time-big{font-size:66px;font-weight:200;letter-spacing:-2px;font-variant-numeric:tabular-nums;}
.date-text{font-size:16px;color:var(--text-secondary);margin-top:4px;}

.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 12px;padding:20px 0;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.app-icon:active .icon-box{transform:scale(.9);opacity:.7;}
.icon-box{width:66px;height:66px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.icon-box svg{width:31px;height:31px;stroke:var(--text);stroke-width:1.5;fill:none;}
.icon-box .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.icon-label{font-size:12px;color:var(--text);font-weight:500;}

.widget-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.widget-title{font-size:15px;font-weight:600;margin-bottom:12px;}
.calendar-row{display:flex;justify-content:space-between;}
.calendar-day{text-align:center;flex:1;}
.calendar-day .day-name{font-size:12px;color:var(--text-secondary);font-weight:500;margin-bottom:6px;}
.calendar-day .day-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;margin:0 auto;}
.calendar-day .day-num.today{background:var(--accent);color:#fff;}
.calendar-day .day-num.future{color:var(--text-tertiary);}
.quote-text{font-size:17px;line-height:1.7;text-align:center;font-style:italic;}
.search-box{display:flex;align-items:center;gap:8px;background:rgba(118,118,128,0.12);border-radius:10px;padding:10px 12px;margin:12px 0;}
.search-box svg{width:16px;height:16px;stroke:var(--text-secondary);stroke-width:2;fill:none;}
.search-box input{flex:1;border:none;background:none;font-size:16px;color:var(--text);outline:none;font-family:inherit;-webkit-user-select:text;user-select:text;}

/* App iframe container */
.app-frame{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;border:none;z-index:200;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);}
.app-frame.active{transform:translateX(0);}
</style>
</head>
<body>

<div class="pwa-container">
  <div class="status-bar" id="statusBar">
    <span class="time" id="statusTime">9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M1 4.5C1 3.67 1.67 3 2.5 3H4v5.5c0 .28-.22.5-.5.5h-2c-.28 0-.5-.22-.5-.5V4.5zM5.5 2C5.5 1.17 6.17.5 7 .5h1.5v8c0 .28-.22.5-.5.5H6c-.28 0-.5-.22-.5-.5V2zM10 3c0-.83.67-1.5 1.5-1.5H13v6c0 .28-.22.5-.5.5h-2c-.28 0-.5-.22-.5-.5V3zM14.5 4.5c0-.83.67-1.5 1.5-1.5h.5v4.5c0 .28-.22.5-.5.5h-.5c-.55 0-1-.45-1-1V4.5z"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 1C4.5 1 2 3 0 5.5 2 8 4.5 10 7.5 10S13 8 15 5.5C13 3 10.5 1 7.5 1z"/></svg>
      <div class="battery-body"><div class="battery-level"></div></div>
    </div>
  </div>

  <div class="screen-container">
    <div class="pages-wrapper" id="pagesWrapper">
      <div class="page" id="page1">
        <div class="greeting-card">
          <div class="greeting-row">
            <div class="greeting-text"><h1>Hello, Koimiao</h1><p>Have a nice day ✨</p></div>
            <div class="avatar-ring"><div class="avatar-inner"><div class="avatar-img"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></div></div></div>
          </div>
          <div class="time-display"><div class="time-big" id="timeBig">9:41</div><div class="date-text" id="dateText">Sunday, September 27</div></div>
        </div>
        <div class="app-grid">
          <div class="app-icon" onclick="openApp('wechat')"><div class="icon-box"><span class="badge">5</span><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div><span class="icon-label">微信</span></div>
          <div class="app-icon" onclick="openApp('profile')"><div class="icon-box"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="icon-label">档案</span></div>
          <div class="app-icon" onclick="openApp('diary')"><div class="icon-box"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div><span class="icon-label">日记</span></div>
          <div class="app-icon" onclick="openApp('dating')"><div class="icon-box"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></div><span class="icon-label">约会</span></div>
          <div class="app-icon" onclick="openApp('worldbook')"><div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div><span class="icon-label">世界书</span></div>
          <div class="app-icon" onclick="openApp('memory')"><div class="icon-box"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div><span class="icon-label">记忆</span></div>
          <div class="app-icon" onclick="openApp('trip')"><div class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><span class="icon-label">行程</span></div>
          <div class="app-icon" onclick="openApp('mailbox')"><div class="icon-box"><span class="badge">3</span><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg></div><span class="icon-label">信箱</span></div>
        </div>
        <div class="widget-card"><div class="widget-title">This Week</div><div class="calendar-row" id="calendarRow"></div></div>
      </div>

      <div class="page" id="page2">
        <div class="greeting-card"><div class="time-display"><div class="time-big" id="timeBig2">9:41</div><div class="date-text" id="dateText2">2026年09月27日</div></div></div>
        <div class="widget-card"><div class="quote-text">"比起永远，希望我们更喜欢每个今天"</div></div>
        <div class="app-grid">
          <div class="app-icon" onclick="openApp('beauty')"><div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.8-.13 2.65-.35-.22-2.03.34-4.63 2.1-6.4 1.77-1.76 4.37-2.32 6.4-2.1.22-.85.35-1.72.35-2.65 0-5.5-4.5-10-10-10z"/></svg></div><span class="icon-label">美化</span></div>
          <div class="app-icon" onclick="openApp('settings')"><div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div><span class="icon-label">设置</span></div>
          <div class="app-icon" onclick="openApp('findphone')"><div class="icon-box"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><path d="M12 18h.01"/></svg></div><span class="icon-label">查手机</span></div>
          <div class="app-icon" onclick="openApp('mcp')"><div class="icon-box"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div><span class="icon-label">MCP</span></div>
        </div>
        <div class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" placeholder="Search..."></div>
      </div>
    </div>
    <div class="page-dots"><div class="dot active" id="dot1"></div><div class="dot" id="dot2"></div></div>
  </div>

  <iframe class="app-frame" id="appFrame"></iframe>
</div>

<script>
var currentPage=0;

function updateTime(){
  var now=new Date(),h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0'),t=h+':'+m;
  document.getElementById('statusTime').textContent=t;
  document.getElementById('timeBig').textContent=t;
  document.getElementById('timeBig2').textContent=t;
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dateText').textContent=days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
  document.getElementById('dateText2').textContent=now.getFullYear()+'年'+String(now.getMonth()+1).padStart(2,'0')+'月'+String(now.getDate()).padStart(2,'0')+'日';
}
function generateCalendar(){
  var now=new Date(),today=now.getDate(),dow=now.getDay(),row=document.getElementById('calendarRow'),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],html='';
  for(var i=0;i<7;i++){var d=new Date(now);d.setDate(today+(i-dow));var isT=d.getDate()===today&&d.getMonth()===now.getMonth(),isF=d>now&&!isT;html+='<div class="calendar-day"><div class="day-name">'+names[i]+'</div><div class="day-num '+(isT?'today':'')+' '+(isF?'future':'')+'">'+d.getDate()+'</div></div>';}
  row.innerHTML=html;
}

var pw=document.getElementById('pagesWrapper'),sX=0,cX=0,drag=false;
pw.addEventListener('touchstart',function(e){sX=e.touches[0].clientX;drag=true;pw.style.transition='none';},{passive:true});
pw.addEventListener('touchmove',function(e){if(!drag)return;cX=e.touches[0].clientX;var diff=cX-sX,off=-currentPage*50+(diff/pw.offsetWidth)*50;pw.style.transform='translateX('+Math.max(-50,Math.min(0,off))+'%)';},{passive:true});
pw.addEventListener('touchend',function(){if(!drag)return;drag=false;pw.style.transition='transform .4s cubic-bezier(.25,.46,.45,.94)';var diff=cX-sX;if(Math.abs(diff)>50){if(diff<0&&currentPage<1)currentPage=1;else if(diff>0&&currentPage>0)currentPage=0;}pw.style.transform='translateX('+(-currentPage*50)+'%)';document.getElementById('dot1').classList.toggle('active',currentPage===0);document.getElementById('dot2').classList.toggle('active',currentPage===1);});

var frame=document.getElementById('appFrame');
function openApp(name){
  frame.src='apps/'+name+'.html';
  frame.classList.add('active');
  document.querySelector('.page-dots').style.display='none';
}
function closeApp(){
  frame.classList.remove('active');
  document.querySelector('.page-dots').style.display='flex';
  setTimeout(function(){frame.src='about:blank';},350);
}
// 监听子页面发来的关闭消息
window.addEventListener('message',function(e){
  if(e.data==='closeApp')closeApp();
});

updateTime();generateCalendar();setInterval(updateTime,1000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/minicookie_phone/sw.js').catch(function(){});});}
</script>
</body>
</html>
