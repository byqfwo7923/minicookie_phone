<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- PWA Meta Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Phone">
<meta name="application-name" content="Mini Phone">
<meta name="theme-color" content="#f2f2f7">
<meta name="msapplication-TileColor" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- iOS Icons -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">

<!-- iOS Splash Screens -->
<link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">

<title>Mini Phone</title>

<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-hover: #f5f5f5;
  --text: #000000;
  --text-secondary: #8e8e93;
  --text-tertiary: #c7c7cc;
  --border: rgba(60,60,67,0.1);
  --accent: #007aff;
  --danger: #ff3b30;
  --success: #34c759;
  --warning: #ff9500;
  --purple: #af52de;
  --pink: #ff2d55;
  --teal: #5ac8fa;
  
  /* Safe Areas for PWA */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

/* Dark Mode */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --card-hover: #2c2c2e;
    --text: #ffffff;
    --text-secondary: #8e8e93;
    --text-tertiary: #48484a;
    --border: rgba(255,255,255,0.1);
  }
}

/* ===== Reset & Base ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== PWA Container ===== */
.pwa-container {
  width: 100%;
  height: 100%;
  max-width: 100vw;
  max-height: 100vh;
  max-height: 100dvh;
  overflow: hidden;
  position: relative;
  background: var(--bg);
  
  /* Safe area padding */
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
  padding-right: var(--sar);
}

/* Desktop Preview Mode */
@media (min-width: 500px) and (min-height: 700px) {
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    padding: 20px;
  }
  
  .pwa-container {
    width: 390px;
    height: 844px;
    max-height: 90vh;
    border-radius: 44px;
    box-shadow: 0 0 0 12px #1a1a1a, 0 0 0 14px #333, 0 30px 80px rgba(0,0,0,0.5);
    padding: 0;
    overflow: hidden;
  }
  
  .pwa-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 34px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 9999;
  }
}

/* Standalone PWA Mode */
@media (display-mode: standalone), (display-mode: fullscreen) {
  body {
    background: var(--bg);
    padding: 0;
  }
  
  .pwa-container {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border-radius: 0;
    box-shadow: none;
  }
  
  .pwa-container::before {
    display: none;
  }
}

/* ===== iOS 18 Status Bar ===== */
.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: calc(44px + var(--sat));
  padding-top: var(--sat);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-left: calc(20px + var(--sal));
  padding-right: calc(20px + var(--sar));
  z-index: 100;
  background: var(--bg);
  transition: opacity 0.3s, transform 0.3s;
}

.status-bar.hidden {
  opacity: 0;
  transform: translateY(-100%);
  pointer-events: none;
}

.status-bar .time {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  min-width: 54px;
}

.status-bar .status-icons {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 70px;
  justify-content: flex-end;
}

.battery-icon {
  display: flex;
  align-items: center;
  gap: 2px;
}

.battery-body {
  width: 24px;
  height: 11px;
  border: 1px solid var(--text);
  border-radius: 3px;
  padding: 1px;
  position: relative;
}

.battery-body::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 5px;
  background: var(--text);
  border-radius: 0 1px 1px 0;
}

.battery-level {
  height: 100%;
  width: 70%;
  background: var(--text);
  border-radius: 1px;
}

/* ===== Screen Container ===== */
.screen-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== Pages Wrapper (Swipeable) ===== */
.pages-wrapper {
  display: flex;
  width: 200%;
  height: 100%;
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.page {
  width: 50%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-top: calc(44px + var(--sat));
  padding-bottom: calc(88px + var(--sab));
  padding-left: var(--sal);
  padding-right: var(--sar);
}

.page::-webkit-scrollbar {
  display: none;
}

/* Page Dots */
.page-dots {
  position: absolute;
  bottom: calc(94px + var(--sab));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 50;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-tertiary);
  transition: all 0.3s;
}

.dot.active {
  background: var(--text);
  width: 18px;
  border-radius: 3px;
}

/* ===== Home Screen Styles ===== */
.home-section {
  padding: 0 20px;
}

.greeting-card {
  padding: 20px 0;
}

.greeting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.avatar-ring {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
  padding: 3px;
}

.avatar-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--bg);
  padding: 2px;
}

.avatar-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar-img svg {
  width: 28px;
  height: 28px;
  stroke: var(--text-secondary);
  stroke-width: 1.5;
  fill: none;
}

.greeting-text h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.greeting-text p {
  font-size: 14px;
  color: var(--text-secondary);
}

.time-display {
  text-align: center;
  padding: 16px 0;
}

.time-big {
  font-size: 54px;
  font-weight: 200;
  color: var(--text);
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}

.date-text {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* ===== App Grid ===== */
.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 8px;
  padding: 16px 0;
}

.app-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.app-icon:active .icon-box {
  transform: scale(0.9);
  opacity: 0.8;
}

.icon-box {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, opacity 0.2s;
  position: relative;
}

.icon-box svg {
  width: 26px;
  height: 26px;
  stroke: var(--text);
  stroke-width: 1.5;
  fill: none;
}

.icon-box .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  background: var(--danger);
  color: white;
  font-size: 11px;
  font-weight: 600;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-label {
  font-size: 11px;
  color: var(--text);
  font-weight: 500;
  text-align: center;
}

/* ===== Widget Cards ===== */
.widget-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

.widget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.widget-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.widget-more {
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
}

/* Calendar */
.calendar-row {
  display: flex;
  justify-content: space-between;
}

.calendar-day {
  text-align: center;
  flex: 1;
}

.calendar-day .day-name {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 6px;
}

.calendar-day .day-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin: 0 auto;
}

.calendar-day .day-num.today {
  background: var(--accent);
  color: white;
}

.calendar-day .day-num.future {
  color: var(--text-tertiary);
}

/* Quote */
.quote-text {
  font-size: 15px;
  color: var(--text);
  line-height: 1.7;
  text-align: center;
  font-style: italic;
}

/* ===== Dock ===== */
.dock {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(84px + var(--sab));
  padding-bottom: var(--sab);
  background: rgba(242, 242, 247, 0.9);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 50;
  border-top: 0.5px solid var(--border);
}

@media (prefers-color-scheme: dark) {
  .dock {
    background: rgba(0, 0, 0, 0.9);
  }
}

.dock-icon {
  width: 50px;
  height: 50px;
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}

.dock-icon:active {
  transform: scale(0.9);
}

.dock-icon svg {
  width: 24px;
  height: 24px;
  stroke: var(--text);
  stroke-width: 1.5;
  fill: none;
}

/* Home Indicator */
.home-indicator {
  position: absolute;
  bottom: calc(8px + var(--sab));
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: var(--text);
  opacity: 0.2;
  border-radius: 3px;
  z-index: 101;
}

/* ===== Sub Pages ===== */
.sub-page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  z-index: 80;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
}

.sub-page.active {
  transform: translateX(0);
}

.sub-header {
  display: flex;
  align-items: center;
  padding-top: calc(10px + var(--sat));
  padding-bottom: 10px;
  padding-left: calc(16px + var(--sal));
  padding-right: calc(16px + var(--sar));
  background: var(--bg);
  flex-shrink: 0;
  min-height: calc(44px + var(--sat));
  position: relative;
}

.sub-header .back-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 17px;
  color: var(--accent);
  font-family: inherit;
  padding: 0;
}

.sub-header .back-btn svg {
  width: 12px;
  height: 20px;
  stroke: var(--accent);
  stroke-width: 2.5;
  fill: none;
}

.sub-header .sub-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}

.sub-header .header-action {
  margin-left: auto;
  background: none;
  border: none;
  font-size: 17px;
  color: var(--accent);
  cursor: pointer;
  font-family: inherit;
}

.sub-body {
  flex: 1;
  overflow-y: auto;
  padding-bottom: calc(20px + var(--sab));
  scrollbar-width: none;
}

.sub-body::-webkit-scrollbar {
  display: none;
}

/* ===== Settings Styles ===== */
.settings-header {
  padding: 8px 16px;
  padding-left: calc(16px + var(--sal));
  padding-right: calc(16px + var(--sar));
}

.settings-title {
  font-size: 34px;
  font-weight: 700;
  color: var(--text);
}

.settings-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(118,118,128,0.12);
  border-radius: 10px;
  padding: 8px 12px;
  margin-top: 10px;
}

.settings-search svg {
  width: 16px;
  height: 16px;
  stroke: var(--text-secondary);
  stroke-width: 2;
  fill: none;
  flex-shrink: 0;
}

.settings-search input {
  flex: 1;
  border: none;
  background: none;
  font-size: 17px;
  color: var(--text);
  outline: none;
  font-family: inherit;
}

.settings-search input::placeholder {
  color: var(--text-secondary);
}

/* User Card */
.user-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  margin: 16px;
  margin-left: calc(16px + var(--sal));
  margin-right: calc(16px + var(--sar));
  background: var(--card);
  border-radius: 14px;
  cursor: pointer;
}

.user-card:active {
  background: var(--card-hover);
}

.user-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  font-weight: 600;
  flex-shrink: 0;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.user-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}

.user-arrow svg {
  width: 14px;
  height: 14px;
  stroke: var(--text-tertiary);
  stroke-width: 2.5;
  fill: none;
}

/* Settings Group */
.settings-group {
  margin: 8px 16px;
  margin-left: calc(16px + var(--sal));
  margin-right: calc(16px + var(--sar));
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
}

.settings-group-label {
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  text-transform: uppercase;
  padding: 8px 16px 6px;
  padding-left: calc(16px + var(--sal));
  margin-top: 24px;
}

/* Settings Item */
.settings-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  cursor: pointer;
  position: relative;
}

.settings-item:active {
  background: var(--card-hover);
}

.settings-item:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 54px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--border);
}

.settings-icon {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.settings-icon svg {
  width: 18px;
  height: 18px;
  stroke: white;
  stroke-width: 1.5;
  fill: none;
}

.settings-icon.blue { background: var(--accent); }
.settings-icon.red { background: var(--danger); }
.settings-icon.green { background: var(--success); }
.settings-icon.orange { background: var(--warning); }
.settings-icon.purple { background: var(--purple); }
.settings-icon.pink { background: var(--pink); }
.settings-icon.teal { background: var(--teal); }
.settings-icon.gray { background: #8e8e93; }

.settings-content {
  flex: 1;
  min-width: 0;
}

.settings-label {
  font-size: 17px;
  color: var(--text);
}

.settings-value {
  font-size: 17px;
  color: var(--text-secondary);
}

.settings-arrow svg {
  width: 14px;
  height: 14px;
  stroke: var(--text-tertiary);
  stroke-width: 2.5;
  fill: none;
}

.settings-badge {
  background: var(--danger);
  color: white;
  font-size: 14px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 10px;
  min-width: 22px;
  text-align: center;
}

/* Toggle Switch */
.toggle-switch {
  width: 51px;
  height: 31px;
  background: #e9e9eb;
  border-radius: 16px;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
  flex-shrink: 0;
}

.toggle-switch.active {
  background: var(--success);
}

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 27px;
  height: 27px;
  background: white;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: transform 0.3s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.toggle-switch.active::after {
  transform: translateX(20px);
}

/* ===== Input Styles ===== */
.input-group {
  margin: 8px 16px;
  margin-left: calc(16px + var(--sal));
  margin-right: calc(16px + var(--sar));
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
}

.input-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  position: relative;
}

.input-item:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 16px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--border);
}

.input-item label {
  width: 100px;
  font-size: 17px;
  color: var(--text);
  flex-shrink: 0;
}

.input-item input,
.input-item select {
  flex: 1;
  border: none;
  background: none;
  font-size: 17px;
  color: var(--text);
  text-align: right;
  outline: none;
  font-family: inherit;
}

.input-item input::placeholder {
  color: var(--text-tertiary);
}

/* ===== API Card ===== */
.api-card {
  margin: 8px 16px;
  margin-left: calc(16px + var(--sal));
  margin-right: calc(16px + var(--sar));
  background: var(--card);
  border-radius: 14px;
  overflow: hidden;
}

.api-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--border);
}

.api-card-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}

.api-card-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--success);
}

.api-card-status.offline {
  color: var(--danger);
}

.api-card-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

<script>
// ===== App State =====
let currentPage = 0;
let statusBarVisible = true;

// ===== Time & Date =====
function updateTime() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const timeStr = `${h}:${m}`;
  
  document.getElementById('statusTime').textContent = timeStr;
  document.getElementById('timeBig').textContent = timeStr;
  document.getElementById('timeBig2').textContent = timeStr;
  
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  
  document.getElementById('dateText').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  document.getElementById('dateText2').textContent = `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
}

function generateCalendar() {
  const now = new Date();
  const today = now.getDate();
  const dayOfWeek = now.getDay();
  
  const calendarRow = document.getElementById('calendarRow');
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  
  let html = '';
  for (let i = 0; i < 7; i++) {
    const dayOffset = i - dayOfWeek;
    const date = new Date(now);
    date.setDate(today + dayOffset);
    
    const isToday = date.getDate() === today;
    const isFuture = date > now && !isToday;
    
    html += `
      <div class="calendar-day">
        <div class="day-name">${dayNames[i]}</div>
        <div class="day-num ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}">${date.getDate()}</div>
      </div>
    `;
  }
  calendarRow.innerHTML = html;
}

// ===== Page Swiping =====
const pagesWrapper = document.getElementById('pagesWrapper');
let startX = 0, currentX = 0, isDragging = false;

pagesWrapper.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  isDragging = true;
  pagesWrapper.style.transition = 'none';
});

pagesWrapper.addEventListener('touchmove', e => {
  if (!isDragging) return;
  currentX = e.touches[0].clientX;
  const diff = currentX - startX;
  const offset = -currentPage * 50 + (diff / pagesWrapper.offsetWidth) * 50;
  pagesWrapper.style.transform = `translateX(${Math.max(-50, Math.min(0, offset))}%)`;
});

pagesWrapper.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  pagesWrapper.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  
  const diff = currentX - startX;
  if (Math.abs(diff) > 50) {
    if (diff < 0 && currentPage < 1) currentPage = 1;
    else if (diff > 0 && currentPage > 0) currentPage = 0;
  }
  updatePagePosition();
});

function updatePagePosition() {
  pagesWrapper.style.transform = `translateX(${-currentPage * 50}%)`;
  document.getElementById('dot1').classList.toggle('active', currentPage === 0);
  document.getElementById('dot2').classList.toggle('active', currentPage === 1);
}

// ===== Navigation =====
function openPage(name) {
  const page = document.getElementById('page-' + name);
  if (page) {
    page.classList.add('active');
    document.getElementById('mainDock').style.display = 'none';
    document.querySelector('.page-dots').style.display = 'none';
  }
}

function closePage(name) {
  const page = document.getElementById('page-' + name);
  if (page) {
    page.classList.remove('active');
    document.getElementById('mainDock').style.display = 'flex';
    document.querySelector('.page-dots').style.display = 'flex';
  }
}

function openWechat() {
  document.getElementById('wechatPage')?.classList.add('active');
  document.getElementById('mainDock').style.display = 'none';
  document.querySelector('.page-dots').style.display = 'none';
}

function closeWechat() {
  document.getElementById('wechatPage')?.classList.remove('active');
  document.getElementById('mainDock').style.display = 'flex';
  document.querySelector('.page-dots').style.display = 'flex';
}

function openSettings() {
  document.getElementById('settingsPage')?.classList.add('active');
  document.getElementById('mainDock').style.display = 'none';
  document.querySelector('.page-dots').style.display = 'none';
}

function closeSettings() {
  document.getElementById('settingsPage')?.classList.remove('active');
  document.getElementById('mainDock').style.display = 'flex';
  document.querySelector('.page-dots').style.display = 'flex';
}

// ===== Modal =====
function showModal(type) {
  // Modal logic here
  document.getElementById('modalOverlay').classList.add('active');
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function confirmModal() {
  hideModal();
}

// ===== Status Bar Toggle =====
function toggleStatusBar() {
  statusBarVisible = !statusBarVisible;
  document.getElementById('statusBar').classList.toggle('hidden', !statusBarVisible);
}

// ===== Initialize =====
document.addEventListener('DOMContentLoaded', () => {
  updateTime();
  generateCalendar();
  setInterval(updateTime, 1000);
});

// ===== PWA Install Prompt =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

// ===== Service Worker Registration =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW registration failed'));
  });
}
</script>
